<body>
  <header>
    <div class="header-title">
      <h1>دليل فعاليات المدينة</h1>

    <div class="header-nav">
      <nav>

      <label class="form-check-label" for="darkModeSwitch">الوضع الداكن</label>
    </div>
  </header>
  <main>

    <h2>اتصل بنا</h2>



    <div id="alertPlaceholder" class="mb-3"></div>

    <form id="contact-form">
      <label>الاسم:</label>
      <input type="text" id="name" placeholder="اكتب اسمك">

      <label>البريد الإلكتروني:</label>
      <input type="email" id="email" placeholder="exmple@gmail.com">

      <label>الرسالة:</label>
      <textarea id="message" placeholder="اكتب رساتك هنا"></textarea>

      <button class="btn btn-success" type="submit">إرسال</button>
      <button class="btn btn-danger" type="reset">مسح</button>
    </form>



    <script src="assets/Js/main.js"></script>

    <section>
      <h3>معلومات تواصل بديلة</h3>
      <p>📧 البريد: info@events.com</p>
      <p>📱 تابعنا على السوشيال ميديا</p>
    </section>
  </main>

  <footer>
    <p>© 2025 دليل فعاليات المدينة</p>
